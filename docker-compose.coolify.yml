version: "3.8"

# ================================================
# Coolify Deployment Configuration
# Zero-downtime deployment with health checks
# ================================================

services:
  transrentals-app:
    image: ${DOCKER_IMAGE:-transrentals:latest}
    container_name: transrentals-app-${DEPLOYMENT_ID:-v1}
    restart: unless-stopped

    # Health check for zero-downtime deployment
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

    # Environment variables (managed by Coolify)
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-TransRentals}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}

    # Labels for Coolify management
    labels:
      # Coolify metadata
      - "coolify.managed=true"
      - "coolify.version=${VERSION:-latest}"
      - "coolify.deployment_id=${DEPLOYMENT_ID:-v1}"

      # Health check endpoint
      - "coolify.healthcheck.path=/api/health"
      - "coolify.healthcheck.interval=10s"
      - "coolify.healthcheck.timeout=5s"
      - "coolify.healthcheck.retries=5"

      # Zero-downtime deployment
      - "coolify.deployment.strategy=rolling"
      - "coolify.deployment.wait_for_healthy=true"

      # Auto-rollback on failure
      - "coolify.deployment.rollback_on_failure=true"
      - "coolify.deployment.max_retry=3"

      # Traefik: route 502/503 errors to maintenance page
      - "traefik.http.middlewares.tr-errors.errors.status=502,503"
      - "traefik.http.middlewares.tr-errors.errors.service=transrentals-maintenance@docker"
      - "traefik.http.middlewares.tr-errors.errors.query=/"
      - "traefik.http.routers.transrentals-app.middlewares=tr-errors"

    # Port mapping (Coolify will handle proxy)
    ports:
      - "${APP_PORT:-3000}:3000"

    # Persistent storage for uploaded private files (vendor / travel-agent documents).
    # Without this, /app/storage lives in the container layer and is wiped on every
    # redeploy — uploaded documents would 404 after a deploy.
    volumes:
      - transrentals-storage:/app/storage

    # Network
    networks:
      - transrentals-network

    # Resource limits (adjust based on your server)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "coolify.managed"

  # Maintenance page — stays alive during deployments
  # Traefik routes 502/503 errors from the main app to this service
  transrentals-maintenance:
    build:
      context: ./maintenance
      dockerfile: Dockerfile
    container_name: transrentals-maintenance
    restart: unless-stopped
    networks:
      - transrentals-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.transrentals-maintenance.loadbalancer.server.port=80"
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "2"

networks:
  transrentals-network:
    driver: bridge
    name: transrentals-network

volumes:
  transrentals-storage:
    name: transrentals-storage
