# CI/CD Pipeline for TransRentals Web Backend
# This pipeline builds and tests the Next.js backend application only.
# Mobile apps (tr-app, tr-vendor-app, tr-driver-app) are excluded and built separately.

name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - 'tr-app/**'           # Ignore customer mobile app
      - 'tr-vendor-app/**'    # Ignore vendor mobile app
      - 'tr-driver-app/**'    # Ignore driver mobile app
      - '**.md'               # Ignore markdown files
      - 'docs/**'             # Ignore documentation
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - 'tr-app/**'           # Ignore customer mobile app
      - 'tr-vendor-app/**'    # Ignore vendor mobile app
      - 'tr-driver-app/**'    # Ignore driver mobile app
      - '**.md'               # Ignore markdown files
      - 'docs/**'             # Ignore documentation

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: saurav1702/tran_stable

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --prefer-offline
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/test_db

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/test_db

      - name: Run Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/test_db
        continue-on-error: true

      - name: Run backend tests
        run: npm test || echo "No tests configured yet"
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/test_db
        continue-on-error: true

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --prefer-offline
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/test_db

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/test_db

      - name: Run Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/test_db
        continue-on-error: true

      - name: Run frontend tests
        run: npm test || echo "No tests configured yet"
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/test_db
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --prefer-offline
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/test_db

      - name: Run security audit
        run: npm audit --production --audit-level=high
        continue-on-error: true

  backend-linting:
    name: Backend Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --prefer-offline
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/test_db

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://dummy:dummy@127.0.0.1:3306/dummy

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  build:
    name: Build Application (ISR — No DB Required)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Step 3: Cache Next.js build (.next/cache)
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm install --prefer-offline
        env:
          DATABASE_URL: mysql://dummy:dummy@127.0.0.1:3306/dummy

      # Step 5: Generate Prisma Client
      - name: Generate Prisma Client
        run: |
          echo "🔧 Generating Prisma Client..."
          npx prisma generate
          echo "✅ Prisma Client generated"
        env:
          DATABASE_URL: mysql://dummy:dummy@127.0.0.1:3306/dummy

      # Step 6: Build Application (ISR mode — no DB, no static page generation)
      # Pages are generated on first request (ISR) and pre-warmed by warm-cache workflow
      - name: Build Application
        run: |
          echo "🚀 Building in ISR mode (SKIP_DATABASE_CALLS=1)..."
          echo "   Pages will be generated on-demand via ISR after deployment"
          echo "   Cache warming runs automatically after deploy (warm-cache.yml)"
          npm run build
          echo "✅ Build completed"
        env:
          DATABASE_URL: mysql://dummy:dummy@127.0.0.1:3306/dummy
          SKIP_DATABASE_CALLS: '1'
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'build-time-secret' }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'https://transrentals.in' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://transrentals.in' }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID || 'dummy' }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET || 'dummy' }}
          NODE_ENV: production

      # Step 7: Show Build Statistics
      - name: Build Statistics
        run: |
          echo "📊 Build Statistics:"
          echo "================================"
          if [ -d ".next" ]; then
            echo "📁 .next directory size:"
            du -sh .next
            echo ""
            echo "📄 Pre-rendered HTML pages (should be minimal with ISR):"
            find .next -name "*.html" 2>/dev/null | wc -l
            echo ""
            echo "📦 Build artifacts:"
            ls -lh .next/ | head -10
          else
            echo "⚠️  .next directory not found"
          fi


  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-scan, backend-linting, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This image copies the full node_modules + .next standalone output +
      # Prisma engines into the final layer (see the Dockerfile's runner
      # stage — trimming node_modules there has broken `prisma migrate
      # deploy` before, so it stays whole). That, plus whatever Buildx's own
      # GHA cache has accumulated, is enough to exhaust a stock ubuntu-latest
      # runner's free disk during the image export step ("no space left on
      # device"). None of this — Android SDK, .NET, GHC, CodeQL, the
      # preinstalled Docker images — is used by a Node.js/Next.js build, so
      # it's safe to clear before the real build starts.
      - name: Free up runner disk space
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          docker image prune --all --force || true
          docker builder prune --all --force || true
          echo "After cleanup:"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  deploy-to-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy notification
        run: |
          echo "Docker image pushed to ghcr.io/saurav1702/tran_stable:latest"
          echo "Ready for Coolify deployment"
