name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'tr-app/**'
      - 'tr-vendor-app/**'
      - '**.md'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'tr-app/**'
      - 'tr-vendor-app/**'
      - '**.md'

env:
  NODE_VERSION: '20'
  # Skip type check and lint in build (handled separately)
  SKIP_TYPE_CHECK: true
  SKIP_LINT: true

jobs:
  # Run linting
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: mysql://root:@localhost:3306/transrentals

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  # Run type checking
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: mysql://root:@localhost:3306/transrentals

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://root:@localhost:3306/transrentals

      - name: Run TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true

  # Run tests
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: mysql://root:@localhost:3306/transrentals

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://root:@localhost:3306/transrentals

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
        continue-on-error: true

      - name: Upload test coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: mysql://root:@localhost:3306/transrentals

      - name: Run npm audit
        run: npm audit --production
        continue-on-error: true

      - name: Check for console.log statements
        run: |
          echo "Checking for console.log statements in production code..."
          CONSOLE_COUNT=$(grep -r "console\.\(log\|error\|warn\)" --include="*.ts" --include="*.tsx" src/app/api/ src/lib/ | wc -l || echo "0")
          echo "Found $CONSOLE_COUNT console statements"
          if [ "$CONSOLE_COUNT" -gt 100 ]; then
            echo "::warning::High number of console statements ($CONSOLE_COUNT). Consider using the logger utility."
          fi

  # Build application
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && !cancelled()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: mysql://root:@localhost:3306/transrentals

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://root:@localhost:3306/transrentals

      - name: Build application
        run: npm run build
        env:
          SKIP_TYPE_CHECK: true
          SKIP_LINT: true
          SKIP_ENV_VALIDATION: "1"
          # Add other required env vars
          DATABASE_URL: mysql://root:@localhost:3306/transrentals
          NEXTAUTH_SECRET: ci-test-secret-for-build-only
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
          # Use mock data for blog during build to avoid database dependency
          NEXT_PUBLIC_BLOG_DATA_SOURCE: mock

      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la .next/ || echo "No .next folder found"
          ls -la .next/standalone/ 2>/dev/null || echo "No standalone folder"
          ls -la .next/static/ 2>/dev/null || echo "No static folder"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build
          path: |
            .next/standalone/
            .next/static/
            public/
          if-no-files-found: warn
          retention-days: 7

  # Deploy to staging (on develop branch)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: success() && needs.build.result == 'success' && github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ./

      - name: Verify downloaded artifacts
        run: |
          echo "Checking downloaded artifacts..."
          ls -la .next/ || echo "No .next folder"
          ls -la .next/standalone/ || echo "No standalone folder"
          ls -la public/ || echo "No public folder"

      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment script here
          # Examples:
          # - Deploy to Vercel: vercel deploy --prebuilt
          # - Deploy to AWS: aws s3 sync .next/ s3://staging-bucket/
          # - Deploy to Docker: docker build && docker push

  # Deploy to production (on main branch)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: success() && needs.build.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ./

      - name: Verify downloaded artifacts
        run: |
          echo "Checking downloaded artifacts..."
          ls -la .next/ || echo "No .next folder"
          ls -la .next/standalone/ || echo "No standalone folder"
          ls -la public/ || echo "No public folder"

      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment script here
          # Make sure to include:
          # - Database migrations: npx prisma migrate deploy
          # - Environment validation
          # - Health checks

  # Notify on failure
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, security, build]
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "CI Pipeline failed!"
          # Add notification logic here (Slack, Discord, Email, etc.)
          # Example: curl -X POST -H 'Content-type: application/json' --data '{"text":"CI Failed!"}' $SLACK_WEBHOOK_URL
