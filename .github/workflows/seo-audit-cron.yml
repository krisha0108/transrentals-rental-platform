name: SEO Audit & Crawl Health

on:
  # Weekly full-site SEO audit
  schedule:
    - cron: '0 3 * * 1' # Every Monday 03:00 UTC

  # Manual trigger anytime
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to audit (default: https://transrentals.in)'
        required: false
        default: 'https://transrentals.in'
      concurrency:
        description: 'Concurrent page audits (default: 10)'
        required: false
        default: '10'

env:
  NODE_VERSION: '20'

jobs:
  seo-audit:
    name: Full-site SEO Audit
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://dummy:dummy@127.0.0.1:3306/dummy

      - name: Setup SSH Tunnel to Production Database
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_key
          chmod 600 ~/.ssh/github_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/github_key \
              -L 3307:localhost:3306 \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -f -N \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          for i in $(seq 1 15); do
            if nc -z 127.0.0.1 3307 2>/dev/null; then
              echo "✅ SSH tunnel ready"
              break
            fi
            sleep 2
          done

      - name: Run Full-site SEO Audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BASE_URL: ${{ github.event.inputs.base_url || 'https://transrentals.in' }}
        run: |
          CONCURRENCY=${{ github.event.inputs.concurrency || '10' }}
          echo "🔍 Starting full-site SEO audit..."
          npx tsx scripts/seo-audit-full.ts --concurrency=$CONCURRENCY

      - name: Cleanup SSH Tunnel
        if: always()
        run: |
          pkill -f "ssh.*3307:localhost:3306" || true
          rm -f ~/.ssh/github_key
