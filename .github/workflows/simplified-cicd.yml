name: 🚀 Simplified CI/CD Pipeline

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'tr-app/**'
      - 'tr-vendor-app/**'
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'tr-app/**'
      - 'tr-vendor-app/**'
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  DOCKER_IMAGE: transrentals-app

jobs:
  # ============================================
  # 1. Quick Validation (Basic checks only)
  # ============================================
  validate:
    name: ✅ Quick Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ✅ Validate Prisma Schema
        run: npx prisma validate
        env:
          DATABASE_URL: mysql://dummy:dummy@localhost:3306/dummy

      - name: 🔄 Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://dummy:dummy@localhost:3306/dummy

      - name: 🔍 Lint (Non-blocking)
        run: npm run lint || echo "⚠️  Lint warnings present"
        continue-on-error: true

  # ============================================
  # 2. Build Application
  # ============================================
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: [validate]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔄 Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://dummy:dummy@localhost:3306/dummy

      - name: 🏗️ Build Application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: mysql://dummy:dummy@localhost:3306/dummy
          NEXTAUTH_SECRET: build-test-secret
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: ✅ Verify Build
        run: |
          if [ ! -d ".next" ]; then
            echo "❌ Build failed"
            exit 1
          fi
          echo "✅ Build successful"

  # ============================================
  # 3. Docker Build & Push
  # ============================================
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_NAME=TransRentals
            NEXT_PUBLIC_APP_URL=https://transrentals.com

      - name: ✅ Docker Build Success
        run: echo "🎉 Docker image built successfully"

  # ============================================
  # 4. Success Notification
  # ============================================
  success:
    name: ✅ Pipeline Success
    runs-on: ubuntu-latest
    needs: [validate, build, docker]
    if: success()

    steps:
      - name: 🎉 All Checks Passed
        run: |
          echo "================================================"
          echo "✅ CI/CD PIPELINE SUCCESSFUL!"
          echo "================================================"
          echo "✓ Validation passed"
          echo "✓ Build successful"
          echo "✓ Docker image ready"
          echo "================================================"
          echo "🚀 Ready for deployment!"
          echo "================================================"
