<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TransRentals — Back Soon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0fdf4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 40px rgba(0,0,0,0.08);
      padding: 48px 40px;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }

    .logo-wrap {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #059669, #10b981);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      animation: pulse 2s ease-in-out infinite;
    }

    .logo-wrap svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 10px;
    }

    p {
      font-size: 15px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #059669;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 999px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: blink 1.2s ease-in-out infinite;
    }

    .divider {
      border: none;
      border-top: 1px solid #f3f4f6;
      margin: 32px 0;
    }

    .footer {
      font-size: 13px;
      color: #9ca3af;
    }

    .footer a {
      color: #059669;
      text-decoration: none;
      font-weight: 600;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.3); }
      50% { box-shadow: 0 0 0 12px rgba(16,185,129,0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <!-- Car / key icon -->
      <svg viewBox="0 0 24 24">
        <path d="M5 17H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1l2-3h12l2 3h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/>
        <circle cx="7.5" cy="17.5" r="2.5"/>
        <circle cx="16.5" cy="17.5" r="2.5"/>
      </svg>
    </div>

    <h1>We'll be back shortly!</h1>
    <p>
      TransRentals is undergoing a quick update to bring you
      a better experience. This usually takes just a few minutes.
    </p>

    <div class="badge">
      <span class="dot"></span>
      Update in progress
    </div>

    <hr class="divider" />

    <div class="footer">
      Need help right now? Contact us at
      <a href="mailto:support@transrentals.in">support@transrentals.in</a>
    </div>
  </div>
</body>
</html>
